<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Video overlays</title>
<link rel="stylesheet" href="../../node_modules/@fontsource/lilita-one/index.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/bungee/index.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/space-grotesk/500.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/space-grotesk/700.css" />
<style>
  /* Graphics for the edited presentation video, in the website's style. Each [data-out] element is
     saved as a transparent PNG by render_overlays.mjs. Sizes are for a 1920 x 1080 video. */
  body { margin: 0; padding: 40px; background: transparent; font-family: 'Space Grotesk', sans-serif; }
  [data-out] { display: inline-block; margin: 30px; vertical-align: top; }
  .chip {
    font: 34px 'Bungee', sans-serif; text-transform: uppercase; background: #000; color: #ffd400;
    padding: 12px 26px; border-radius: 16px; transform: rotate(-2deg); box-shadow: 6px 6px 0 rgba(0,0,0,.35);
    border: 4px solid #fff; white-space: nowrap;
  }
  .chip b { color: #fff; font-weight: 400; margin-right: 14px; }
  .name {
    display: flex; align-items: center; gap: 24px; padding: 18px 34px 18px 18px; background: #fff;
    border: 5px solid #000; border-radius: 28px; box-shadow: 9px 9px 0 #000; transform: rotate(-1.5deg);
  }
  .name img { width: 132px; height: 132px; border-radius: 50%; } /* the shot's corners hold slide background */
  .name h2 { font: 60px 'Lilita One', sans-serif; margin: 0; line-height: 1; }
  .name span {
    display: inline-block; margin-top: 10px; font: 22px 'Bungee', sans-serif; text-transform: uppercase;
    padding: 6px 16px; border: 3px solid #000; border-radius: 999px; box-shadow: 3px 3px 0 #000;
  }
  .bug { width: 230px; }
  .bug svg, .big-logo svg { width: 100%; height: auto; display: block; }
  .big-logo { width: 900px; }
  .glood-bg { display: none; }
  .title { text-align: center; }
  .title h1 {
    font: 120px 'Lilita One', sans-serif; margin: 0; color: #fff; -webkit-text-stroke: 5px #000;
    text-shadow: 9px 9px 0 #000; line-height: 1.05; white-space: nowrap;
  }
  .title p { font: 500 34px 'Space Grotesk', sans-serif; margin: 22px 0 0; }
  .bar {
    display: flex; align-items: center; gap: 20px; background: #fff; border: 5px solid #000; border-radius: 22px;
    box-shadow: 8px 8px 0 #000; padding: 16px 30px; font: 500 30px 'Space Grotesk', sans-serif; white-space: nowrap;
  }
  .bar .chip { font-size: 26px; padding: 8px 18px; transform: none; box-shadow: none; border: 0; }
  .pills { display: flex; gap: 22px; }
  .pill {
    font: 32px 'Bungee', sans-serif; text-transform: uppercase; padding: 14px 30px; border: 4px solid #000;
    border-radius: 999px; box-shadow: 5px 5px 0 #000; background: #fff;
  }
</style>
</head>
<body>
  <div id="host"></div>
<script type="module">
  // Filled from render_overlays.mjs: window.SPEC = { chips, names, logo }
  const { chips, names, logo } = window.SPEC;
  const host = document.getElementById('host');
  const add = (id, html) => host.insertAdjacentHTML('beforeend', `<div data-out="${id}">${html}</div>`);
  chips.forEach((c) => add(`chip-${c.slide}`, `<div class="chip"><b>${String(c.slide).padStart(2, '0')}</b>${c.text}</div>`));
  names.forEach((n) => add(`name-${n.slide}`, `<div class="name"><img src="${n.avatar}" alt=""><div><h2>${n.name}</h2><span style="background:${n.color}">${n.role}</span></div></div>`));
  add('bug', `<div class="bug">${logo}</div>`);
  add('big-logo', `<div class="big-logo">${logo}</div>`);
  add('intro-title', `<div class="title"><h1>Startup Presentation</h1></div>`);
  add('intro-team', `<div class="bar"><span class="chip">Team</span>JasMehr Singh · Prashant Pal · Meenakshi Sharma · Rishabh Sharma · Sanyam · Aniket Kumar</div>`);
  add('outro-title', `<div class="title"><h1>Thank you!</h1><p>If you're into it, there's probably a sticker for it.</p></div>`);
  add('outro-pills', `<div class="pills"><span class="pill" style="background:#000;color:#ffd400">glood.vercel.app</span><span class="pill" style="background:#00bbd1">Order on WhatsApp</span><span class="pill" style="background:#ffd400">Open 24/7</span></div>`);
  window.READY = true;
</script>
</body>
</html>
