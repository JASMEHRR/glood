<title>JasMehr's World</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a miniature isometric town fills the screen under a slim bar. First view: areas only; tap an area to see its buildings, tap a building for its card (right panel, bottom sheet on phones). Three colour worlds: day (default), night, gold. */
:root{
  --bg:#e9f1fa; --stage:radial-gradient(120% 90% at 50% 25%,#ffffff 0%,#eaf2fb 55%,#dbe7f5 100%);
  --ink:#16203a; --muted:#56617a; --faint:#8a93a8; --panel:#ffffff; --panel-2:#f2f5fa; --line:#e0e6ef;
  --accent:#3d4fd6; --accent-2:#e9ecff; --label-bg:#ffffff; --label-line:#d3dbe7; --label-ink:#16203a;
  --good:#1f9d57; --warn:#d9731b; --bad:#d6453a; --idea:#7656d8; --idle:#7b8396;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --f-body:"Manrope","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
:root[data-world="night"]{
  --bg:#0c1222; --stage:radial-gradient(120% 90% at 50% 25%,#1b2742 0%,#111a2e 55%,#0a1020 100%);
  --ink:#eef2fb; --muted:#a9b3cb; --faint:#7782a0; --panel:#111a2e; --panel-2:#18233c; --line:#26324f;
  --accent:#8ea0ff; --accent-2:#1d2848; --label-bg:#0f1729; --label-line:#2f3c5e; --label-ink:#eef2fb;
  --good:#6fd39a; --warn:#f2a95c; --bad:#f28a7a; --idea:#b6a4ff; --idle:#9aa3b8; color-scheme:dark;
}
:root[data-world="gold"]{
  --bg:#0b0805; --stage:radial-gradient(120% 90% at 50% 30%,#1c140b 0%,#0f0b06 55%,#080604 100%);
  --ink:#f7eedb; --muted:#cdbb97; --faint:#8f7f60; --panel:#140f09; --panel-2:#1d160d; --line:#3b2d17;
  --accent:#e6b450; --accent-2:#2b200e; --label-bg:#120d06; --label-line:#5a4422; --label-ink:#f7eedb;
  --good:#9bd48f; --warn:#f2a95c; --bad:#ef8069; --idea:#bfaef3; --idle:#b0a487; color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.app{height:100%;display:flex;flex-direction:column}
.bar{position:relative;z-index:8;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{min-width:0;margin-right:auto}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.05;letter-spacing:-.01em}
.brand span{display:block;font-size:13px;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-size:14px;font-weight:700;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-world="gold"] .btn.main{color:#1a1206}
.btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}

.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--stage)}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}

/* map */
.bld,.area{cursor:pointer}
.bld{transition:opacity .25s}
.bld .face{stroke:var(--edge,rgba(20,30,50,.25));stroke-width:1;stroke-linejoin:round}
.bld:hover .top,.bld:focus-visible .top{filter:brightness(1.08)}
.bld:focus,.area:focus{outline:none}
.hit{fill:transparent;stroke:transparent}
.bld:focus-visible .hit,.area:focus-visible .plate{stroke:var(--accent);stroke-width:4}
.bld.on .hit{stroke:var(--accent);stroke-width:4}
.fade .bld:not(.near){opacity:.25}
.fade .lbl.b:not(.near){opacity:.3}
.link{fill:none;stroke-linecap:round;pointer-events:none}
.link.should{stroke-dasharray:8 7}
.link.could{stroke-dasharray:2 8}
.lbl{pointer-events:none}
.lbl rect{fill:var(--label-bg);stroke:var(--label-line)}
.lbl text{font-family:var(--f-body);font-size:13px;font-weight:800;fill:var(--label-ink)}
.lbl.b{display:none}
.lbl.b.show{display:inline}
#map.z1 .lbl.b.p1,#map.z2 .lbl.b{display:inline}
.lbl.station{display:none}
#map.z2 .lbl.station,#map.loopOn .lbl.station{display:inline}
.sign{cursor:pointer}
.sign text{font-family:var(--f-display);font-weight:800;fill:#fff;letter-spacing:.04em}
:root[data-world="gold"] .sign text{fill:#1a1206}
.sign .n{font-family:var(--f-body);font-weight:700;letter-spacing:0;fill:rgba(255,255,255,.88)}
#map.z2 .sign{opacity:.0;pointer-events:none}
.area .plate{transition:fill-opacity .2s}
.area.sel .plate{stroke-width:4}
.smoke{fill:var(--smoke)}
.motion .smoke{animation:smoke 3.6s ease-out infinite}.motion .smoke.b{animation-delay:1.8s}
@keyframes smoke{0%{transform:translateY(0);opacity:.6}100%{transform:translateY(-36px);opacity:0}}
.motion #cloud{animation:bob 5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-10px)}}
.motion .beacon{animation:blink 2.2s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
.motion .halo{animation:pulse 1.6s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.3}}
.motion.intro .rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise .8s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{transform:scaleY(.06);opacity:.2}to{transform:none;opacity:1}}

/* floating bits */
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.zoom svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 20px rgba(0,0,0,.1)}
.crumbs{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;z-index:3;display:flex;gap:8px;align-items:center}
.tip{position:absolute;z-index:4;pointer-events:none;max-width:260px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13px;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.tip b{display:block;font-size:14.5px}
.menu{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:8px;z-index:9;width:min(300px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 16px 40px rgba(0,0,0,.2);display:grid;gap:14px}
.menu h4{margin:0 0 6px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-weight:700;font-size:13.5px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-2);color:var(--accent)}
.menu select{width:100%;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);padding:0 10px;font-weight:600}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;font-weight:600;cursor:pointer}
.sw input{width:20px;height:20px;accent-color:var(--accent)}
.key{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.key span{display:flex;align-items:center;gap:8px}
.key i{width:22px;height:0;border-top:3px solid var(--ink)}
.key i.should{border-top-style:dashed}

/* card */
.panel{position:absolute;top:0;right:0;bottom:0;width:min(470px,100%);z-index:6;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .34s cubic-bezier(.16,1,.3,1);box-shadow:-20px 0 50px rgba(0,0,0,.18)}
.panel.open{transform:none}
.phead{display:flex;align-items:center;gap:8px;padding:12px 14px 10px 18px;border-bottom:1px solid var(--line)}
.crumb{margin-right:auto;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.x{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;display:grid;place-items:center}
.x svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2.2;fill:none;stroke-linecap:round}
.pbody{overflow-y:auto;padding:18px 18px 30px;display:flex;flex-direction:column;gap:20px;overscroll-behavior:contain}
.pbody h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;text-wrap:balance}
.tagline{margin:6px 0 0;font-size:16px;color:var(--muted)}
.pbody h3{margin:0 0 8px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pbody p{margin:0}
.pbody ul,.pbody ol{margin:0;padding-left:20px;display:grid;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2)}
.chip i{width:9px;height:9px;border-radius:50%}
.verdict{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.2;padding:13px 15px;border-radius:12px;background:var(--accent-2);border:1px solid var(--line)}
.verdict small{display:block;margin-top:4px;font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--muted)}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4 div{padding:10px 12px;border-radius:12px;background:var(--panel-2);min-width:0}
.grid4 small{display:block;font-size:12px;color:var(--faint);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.grid4 b{font-size:14.5px}
.depts{list-style:none;padding:0!important}
.depts li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-radius:12px;background:var(--panel-2)}
.depts b{font-weight:800;font-size:14.5px}
.depts span:not(.st){grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.st{align-self:start;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap;color:#fff}
.st.ok{background:var(--good)}.st.build{background:var(--warn)}.st.idea{background:var(--idea)}.st.idle{background:var(--idle)}.st.bad{background:var(--bad)}
:root[data-world="gold"] .st,:root[data-world="night"] .st{color:#0d1220}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
.box{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-size:14px}
.box.bad{border-color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13.5px}
.kv dt{color:var(--faint)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv code,.pile code{font-family:var(--f-mono);font-size:12.5px}
.go{display:flex;flex-wrap:wrap;gap:6px}
.go button{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-size:13.5px;font-weight:800;text-align:left}
.go button em{font-style:normal;font-weight:500;color:var(--faint);font-size:12.5px}
.ln{width:18px;height:0;flex:none;border-top:3px solid var(--ink)}.ln.should{border-top-style:dashed}.ln.could{border-top-style:dotted}
.list{display:grid;gap:8px}
.list button{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 12px;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer}
.list button:hover{border-color:var(--accent)}
.list i{width:12px;height:12px;border-radius:4px;grid-row:span 2}
.list b{font-size:15px}.list span{font-size:13px;color:var(--muted);grid-column:2/4}
.list em{font-style:normal;font-size:12px;font-weight:800;color:var(--muted)}
.links a{display:inline-flex;align-items:center;min-height:42px;padding:0 18px;border-radius:999px;background:var(--accent);color:#fff;font-weight:800;text-decoration:none;margin-right:8px}
:root[data-world="gold"] .links a{color:#1a1206}
.tour{display:flex;gap:8px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line)}
.tour .btn{flex:1}
.pile{list-style:none;padding:0!important}
.pile li{padding:10px 12px;border-radius:12px;background:var(--panel-2)}
.pile b{display:block}.pile span{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.stations{list-style:none;padding:0!important}
.stations li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 12px;border-radius:12px;background:var(--panel-2)}
.stations i{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--good)}
.stations li.wait i{background:var(--warn)}
.stations span{display:block;color:var(--muted);font-size:13.5px}

.over{position:absolute;inset:0;z-index:7;background:var(--panel);overflow-y:auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.over-in{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.over-top{display:flex;align-items:center;gap:12px}
.over-top h2{margin:0 auto 0 0;font-family:var(--f-display);font-weight:800;font-size:28px}
.osec h3{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-family:var(--f-display);font-weight:800;font-size:20px}
.osec h3 i{width:14px;height:14px;border-radius:4px}
.osec p{margin:0 0 10px;color:var(--muted);font-size:14px}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ogrid button{text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:70px}
.ogrid button:hover{border-color:var(--accent)}
.ogrid b{font-size:15px}.ogrid span{font-size:13px;color:var(--muted)}

@media (max-width:899px){
  .panel{top:auto;left:0;width:100%;height:min(66%,660px);border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%);box-shadow:0 -20px 50px rgba(0,0,0,.25)}
  .phead{position:relative;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .phead::before{content:"";position:absolute;left:50%;top:5px;width:38px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
  .pbody{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
}
@media (max-width:600px){
  .brand h1{font-size:21px}.brand span{display:none}
  .tools{width:100%}.tools .btn{flex:1;padding:0 10px}
  .hint{top:auto;bottom:70px;white-space:normal;text-align:center;width:calc(100% - 120px)}
}
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><h1 id="title"></h1><span id="subtitle"></span></div>
    <div class="tools">
      <button class="btn main" id="b-start" type="button"></button>
      <button class="btn" id="b-combos" type="button">Combos</button>
      <button class="btn" id="b-all" type="button">All</button>
      <button class="btn" id="b-view" type="button" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12"/></svg>View</button>
    </div>
  </header>
  <main class="stage" id="stage">
    <svg id="map" role="application" aria-label="Map of the town. Tab moves between areas and buildings, Enter opens one."><defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity=".18"/></filter>
    </defs><g id="world"></g></svg>
    <div class="crumbs" id="crumbs" hidden><button class="btn" type="button" id="b-back"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg><span id="backLabel">Whole town</span></button></div>
    <div class="hint" id="hint">Tap an area to look inside. Tap a building to read about it.</div>
    <div class="tip" id="tip" hidden></div>
    <div class="menu" id="menu" hidden></div>
    <div class="zoom">
      <button type="button" id="zin" aria-label="Zoom in"><svg viewBox="0 0 18 18"><path d="M9 3v12M3 9h12"/></svg></button>
      <button type="button" id="zout" aria-label="Zoom out"><svg viewBox="0 0 18 18"><path d="M3 9h12"/></svg></button>
      <button type="button" id="zfit" aria-label="Show the whole town"><svg viewBox="0 0 18 18"><path d="M2 6V2h4M12 2h4v4M16 12v4h-4M6 16H2v-4"/></svg></button>
    </div>
    <aside class="panel" id="panel" aria-hidden="true">
      <div class="phead"><span class="crumb" id="crumb"></span><button class="x" id="close" type="button" aria-label="Close"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg></button></div>
      <div class="pbody" id="pbody"></div>
    </aside>
    <div class="over" id="over" hidden></div>
  </main>
</div>

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
function hsl(hex) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;

  open: null, district: null, combo: null, seen: store.get('seen', {}),
};
let T = THEMES[state.world] || THEMES.day;
const areaColor = (k) => (T.area ? T.area[k] : D[k].color) || '#888';
const view = { s: .5, x: 0, y: 0 };
const svg = $('map'), world = $('world');
const LIVE = (b) => WS ? ['in use', 'auto'].includes(b.tags?.use) : ['Live', 'In use', 'In use daily', 'Working', 'Playable'].includes(b.pubstatus);
const SOME = (b) => WS ? ['rarely', 'unused'].includes(b.tags?.use) : ['Prototype', 'In progress'].includes(b.pubstatus);

/* ---------------------------------------------------------------- shapes */
function box(x, y, w, d, h, z0, c) {
  const top = [P(x, y, z0 + h), P(x + w, y, z0 + h), P(x + w, y + d, z0 + h), P(x, y + d, z0 + h)];

  return poly(left, `class="face" fill="${c.l}"`) + poly(right, `class="face" fill="${c.r}"`) + poly(top, `class="face top" fill="${c.t}"`);
}
function windows(b, x, y, w, d, h) {
  if (h < 24) return '';

  const win = (q, k) => poly(q, `fill="${hash(b.id + k) < p ? lit : T.win.off}"`);
  for (let z = 9; z <= h - 13; z += 15) {
    for (let c = x + .28; c <= x + w - .5; c += .6) s += win([P(c, y + d, z), P(c + .3, y + d, z), P(c + .3, y + d, z + 8), P(c, y + d, z + 8)], i++);
    for (let c = y + .28; c <= y + d - .5; c += .6) s += win([P(x + w, c, z), P(x + w, c + .3, z), P(x + w, c + .3, z + 8), P(x + w, c, z + 8)], i++);
  }

}
function topper(b, x, y, w, d, h, c, col) {
  const cx = x + w / 2, cy = y + d / 2;
  switch (b.kind) {
    case 'tower': { const a = P(cx, cy, h), t = P(cx, cy, h + 36); return box(cx - .35, cy - .35, .7, .7, 12, h, c) + line(a, t, `stroke="${c.r}" stroke-width="2"`) + `<circle class="beacon" cx="${f1(t[0])}" cy="${f1(t[1])}" r="3.6" fill="#ff5a4e"/>`; }
    case 'mast': { let s = ''; for (let k = 0; k < 3; k++) { const a = P(cx, cy, h + k * 14); s += `<ellipse cx="${f1(a[0])}" cy="${f1(a[1])}" rx="${16 - k * 4}" ry="${8 - k * 2}" fill="none" stroke="${col}" stroke-width="2"/>`; } const t = P(cx, cy, h + 44); return s + line(P(cx, cy, h), t, `stroke="${c.r}" stroke-width="2"`) + `<circle class="beacon" cx="${f1(t[0])}" cy="${f1(t[1])}" r="3.6" fill="#ff5a4e"/>`; }
    case 'factory': { let s = ''; [[x + .5, y + .4], [x + 1.6, y + .4]].forEach(([px, py], i) => { s += box(px, py, .5, .5, 28, h, { t: c.r, l: c.l, r: c.r }); const t = P(px + .25, py + .25, h + 32); s += `<circle class="smoke${i ? ' b' : ''}" cx="${f1(t[0])}" cy="${f1(t[1])}" r="7"/>`; }); return s; }
    case 'shop': { let s = ''; for (let k = 0; k < 5; k++) { const a = x + k * w / 5; s += poly([P(a, y + d, 17), P(a + w / 5, y + d, 17), P(a + w / 5, y + d + .38, 10), P(a, y + d + .38, 10)], `fill="${k % 2 ? '#ffffff' : col}"`); } return s; }
    case 'school': { const r1 = [P(x, y, h), P(x + w, y, h), P(x + w, cy, h + 22), P(x, cy, h + 22)], r2 = [P(x, cy, h + 22), P(x + w, cy, h + 22), P(x + w, y + d, h), P(x, y + d, h)], g = [P(x + w, y, h), P(x + w, y + d, h), P(x + w, cy, h + 22)]; return poly(r1, `class="face" fill="${hs(col, 1, -10)}"`) + poly(r2, `class="face" fill="${col}"`) + poly(g, `class="face" fill="${c.r}"`); }
    case 'library': return box(x - .1, y - .1, w + .2, d + .2, 6, h, { t: col, l: c.l, r: c.r });
    case 'gallery': { const a = P(x + .2, cy, h), b2 = P(x + w - .2, cy, h); return poly([a, b2, [b2[0], b2[1] - 26], [a[0], a[1] - 26]], `fill="${col}" stroke="#fff" stroke-width="1.6"`); }
    case 'well': { const t = P(cx, cy, h + 1); return `<ellipse cx="${f1(t[0])}" cy="${f1(t[1])}" rx="30" ry="15" fill="#3aa0c8"/><ellipse cx="${f1(t[0])}" cy="${f1(t[1])}" rx="14" ry="7" fill="#bfeaf7"/>`; }
    case 'market': { let s = ''; for (let i = 0; i < 3; i++) s += box(x + .2 + i * .95, y + d + .15, .7, .55, 14, 0, { t: [col, '#ffffff', col][i], l: c.l, r: c.r }); return s; }
    case 'theatre': { const t = P(cx, cy, h + 4); return `<ellipse cx="${f1(t[0])}" cy="${f1(t[1])}" rx="27" ry="13.5" fill="#151820" stroke="${col}" stroke-width="2.5"/><ellipse cx="${f1(t[0])}" cy="${f1(t[1])}" rx="17" ry="8.5" fill="none" stroke="#3a3f50"/><ellipse cx="${f1(t[0])}" cy="${f1(t[1])}" rx="6" ry="3" fill="${col}"/>`; }
    case 'arcade': return `<polygon points="${pts([P(x, y, h), P(x + w, y, h), P(x + w, y + d, h), P(x, y + d, h)])}" fill="none" stroke="#ff4fd8" stroke-width="2.4" filter="url(#glow)"/>`;
    case 'tv': return poly([P(x + .25, y + d, 8), P(x + w - .25, y + d, 8), P(x + w - .25, y + d, h - 6), P(x + .25, y + d, h - 6)], `fill="#1d2f4a" stroke="${col}" stroke-width="2"`);
    case 'kiosk': { const a = P(cx, cy, h), t = P(cx, cy, h + 18); return line(a, t, `stroke="${c.r}" stroke-width="1.6"`) + `<circle cx="${f1(t[0])}" cy="${f1(t[1])}" r="3.4" fill="${col}"/>`; }
    case 'lab': { const t = P(cx + .4, cy, h + 10); return `<ellipse cx="${f1(t[0])}" cy="${f1(t[1])}" rx="12" ry="6" fill="${c.l}" stroke="${c.r}" transform="rotate(-20 ${f1(t[0])} ${f1(t[1])})"/>`; }
    case 'studio': { const a = P(x + .3, y + d, h - 4), b2 = P(x + w - .3, y + d, h - 4); return line(a, b2, `stroke="${col}" stroke-width="3"`) + `<circle class="beacon" cx="${f1(a[0])}" cy="${f1(a[1]) - 8}" r="3.4" fill="#ff5a4e"/>`; }
    case 'shed': return box(x + .15, y + .15, w - .3, d - .3, 5, h, { t: hs(col, .7, 8), l: c.l, r: c.r });

}
function scaffold(x, y, w, d, h, col) {
  let s = poly([P(x, y), P(x + w, y), P(x + w, y + d), P(x, y + d)], `fill="${col}" opacity=".15"`);
  [[x, y + d], [x + w, y + d], [x + w, y], [x, y]].forEach(([cx, cy]) => { s += line(P(cx, cy, 0), P(cx, cy, h), `stroke="${col}" stroke-width="1.6" stroke-dasharray="5 4"`); });
  for (let z = 14; z <= h; z += 14) s += `<polyline points="${pts([P(x, y + d, z), P(x + w, y + d, z), P(x + w, y, z)])}" fill="none" stroke="${col}" stroke-width="1.2" opacity=".8"/>`;
  s += poly([P(x, y, h), P(x + w, y, h), P(x + w, y + d, h), P(x, y + d, h)], `fill="${col}" opacity=".18" stroke="${col}" stroke-width="1.4"`);
  const m0 = P(x - .5, y + .2), m1 = P(x - .5, y + .2, h + 40), j1 = P(x + w + .5, y + .2, h + 40);
  return s + line(m0, m1, 'stroke="#f5a524" stroke-width="2.2"') + line(m1, j1, 'stroke="#f5a524" stroke-width="2.2"') + line(j1, [j1[0], j1[1] + 22], `stroke="${T.links.could}" stroke-width="1"`);
}
function pile(b, x, y, col) {
  const c = T.walls(col); let s = '';
  [[.1, .2, .9, .8, 12, 0], [.9, .4, .8, .7, 8, 0], [.4, 1, 1.1, .7, 10, 0], [.5, .5, .6, .6, 10, 10]].forEach(([dx, dy, w, d, h, z]) => { s += box(x + dx, y + dy, w, d, h, z, { t: col, l: c.l, r: c.r }); });
  if (b.hazard) { const t = P(x + 1, y + 1, 44); s += `<polygon points="${f1(t[0])},${f1(t[1] - 12)} ${f1(t[0] + 11)},${f1(t[1] + 7)} ${f1(t[0] - 11)},${f1(t[1] + 7)}" fill="#ffcf4d" stroke="#1a1206" stroke-width="1.5"/><text x="${f1(t[0])}" y="${f1(t[1] + 5)}" text-anchor="middle" font-size="12" font-weight="800" fill="#1a1206">!</text>`; }

}
function obelisk(x, y, w, d, h, col) {
  const cx = x + w / 2, cy = y + d / 2, o = P(cx, cy); let s = '';
  [3.2, 2.4].forEach((r, i) => { s += `<ellipse cx="${f1(o[0])}" cy="${f1(o[1])}" rx="${r * 28}" ry="${r * 14}" fill="none" stroke="${col}" stroke-width="${i ? 1.4 : 2.4}" opacity="${i ? .55 : .9}"/>`; });
  s += box(x, y, w, d, h, 0, T.walls(col));
  const tip = P(cx, cy, h + 20), c = T.walls(col);
  s += poly([P(x, y, h), P(x + w, y, h), tip], `fill="${c.t}"`) + poly([P(x + w, y, h), P(x + w, y + d, h), tip], `fill="${c.r}"`) + poly([P(x, y + d, h), P(x + w, y + d, h), tip], `fill="${c.l}"`);

function roof(b) {
  const [x, y, w, d, h] = b.at;
  if (b.kind === 'cloud') return P(x, y, 200);
  return P(x + w / 2, y + d / 2, h + ({ tower: 42, mast: 48, school: 24, obelisk: 24, scaffold: 8 }[b.kind] ?? 8));
}
const door = (b) => [b.at[0] + b.at[2] / 2, b.at[1] + b.at[3] + .5];

/* ---------------------------------------------------------------- roads */
const start = byId.start, plaza = [start.at[0] + start.at[2] / 2, start.at[1] + start.at[3] + 1.4];
const hubs = {};
Object.entries(D).forEach(([k, d]) => { if (k === 'start' || k === 'scrap') return; const r = d.rect; hubs[k] = [(r[0] + r[2]) / 2, r[3] - .6]; });
const lpath = (a, b) => [a, [b[0], a[1]], b];
const ROUTES = {};
Object.entries(hubs).forEach(([k, h]) => { ROUTES[`plaza>${k}`] = lpath(plaza, h); });
B.forEach((b) => { if (b.d === 'start' || b.d === 'scrap' || b.kind === 'cloud' || !hubs[b.d]) return; ROUTES[`${b.d}>${b.id}`] = lpath(hubs[b.d], door(b)); });
const inArea = (k) => B.filter((b) => b.d === k && b.id !== 'start');

/* ---------------------------------------------------------------- render */
function render() {
  document.documentElement.dataset.world = state.world;
  svg.style.setProperty('--edge', T.edge); svg.style.setProperty('--smoke', T.smoke);
  const plate = (r, at) => poly([P(r[0], r[1]), P(r[2], r[1]), P(r[2], r[3]), P(r[0], r[3])], at);
  let g = '';
  if (WS) g += plate([32, 40, 50, 53], `fill="${T.water}" stroke="${T.waterEdge}" stroke-width="2"`);
  g += plate([0, -2, 48, 40], `fill="${T.land}" stroke="${T.landEdge}" stroke-width="3"`);
  for (let i = 0; i <= 48; i += 2) g += line(P(i, -2), P(i, 40), `stroke="${T.grid}" stroke-width="1"`);
  for (let j = -2; j <= 40; j += 2) g += line(P(0, j), P(48, j), `stroke="${T.grid}" stroke-width="1"`);
  Object.values(ROUTES).forEach((r) => { g += `<polyline points="${pts(r.map((p) => P(p[0], p[1])))}" fill="none" stroke="${T.road}" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>`; });
  Object.entries(ROUTES).forEach(([k, r]) => { if (k.startsWith('plaza>')) g += `<polyline points="${pts(r.map((p) => P(p[0], p[1])))}" fill="none" stroke="${T.roadLine}" stroke-width="1.4" stroke-dasharray="7 8"/>`; });
  // areas: clickable plates
  let areas = '';
  Object.entries(D).forEach(([k, d]) => {
    if (k === 'start') { g += plate(d.rect, `fill="${T.plate}" stroke="${areaColor(k)}" stroke-width="2"`); return; }
    const col = areaColor(k);
    areas += `<g class="area${state.district === k ? ' sel' : ''}" data-district="${k}" tabindex="0" role="button" aria-label="${esc(d.name)}: ${esc(d.blurb)}">${plate(d.rect, `class="plate" fill="${col}" fill-opacity="${state.district === k ? .22 : .12}" stroke="${col}" stroke-width="2"`)}</g>`;
  });
  // light pools under buildings in use
  B.forEach((b) => { if (LIVE(b) && b.kind !== 'cloud') { const [x, y, w, d] = b.at, c = P(x + w / 2, y + d / 2); g += `<ellipse cx="${f1(c[0])}" cy="${f1(c[1])}" rx="${(w + d) * 22}" ry="${(w + d) * 11}" fill="${T.pool}" opacity=".18"/>`; } });
  // the content loop ring
  const L = W.loop, ring = [];
  for (let a = 0; a <= 72; a++) { const t = a / 72 * Math.PI * 2; ring.push(P(L.center[0] + L.radius * Math.cos(t), L.center[1] + L.radius * Math.sin(t))); }
  let ringSvg = `<g class="bld" data-id="__loop" role="button" tabindex="0" aria-label="The content loop"><polyline points="${pts(ring)}" fill="none" stroke="${T.ring[0]}" stroke-width="12" opacity=".14"/><polyline points="${pts(ring)}" fill="none" stroke="${T.ring[0]}" stroke-width="4"/><polyline points="${pts(ring)}" fill="none" stroke="transparent" stroke-width="20"/></g>`;
  // trees
  let trees = '';
  [[2.8, 22.5], [16.5, 22.6], [32.6, 6.2], [32.8, 23.6], [16.5, 27], [31.8, 38.5], [46.6, 22.5], [1.5, 36.5], [17, 2.5], [47, 6.8], [33, 1.5], [29.5, 18], [19, 18.4], [5, 38.5]].forEach(([tx, ty]) => {
    const a = P(tx, ty), t = P(tx, ty, 28);
    trees += `<ellipse cx="${f1(a[0])}" cy="${f1(a[1])}" rx="10" ry="5" fill="#000" opacity=".12"/><polygon points="${f1(t[0])},${f1(t[1])} ${f1(a[0] + 10)},${f1(a[1] - 4)} ${f1(a[0] - 10)},${f1(a[1] - 4)}" fill="${T.tree[0]}"/><polygon points="${f1(t[0])},${f1(t[1])} ${f1(a[0] + 10)},${f1(a[1] - 4)} ${f1(t[0])},${f1(a[1] - 2)}" fill="${T.tree[1]}"/>`;
  });
  // buildings, back to front
  const sorted = B.filter((b) => b.kind !== 'cloud').sort((a, b) => (a.at[0] + a.at[2] / 2 + a.at[1] + a.at[3] / 2) - (b.at[0] + b.at[2] / 2 + b.at[1] + b.at[3] / 2));
  let bl = '';
  sorted.forEach((b, i) => {
    const col = areaColor(b.d), c = T.walls(col), [x, y, w, d, h] = b.at;
    let inner;
    if (b.kind === 'obelisk') inner = obelisk(x, y, w, d, h, col);
    else if (b.planned || b.kind === 'scaffold') inner = scaffold(x, y, w, d, h, col);
    else if (b.kind === 'pile') inner = pile(b, x, y, col);
    else inner = box(x, y, w, d, h, 0, c) + windows(b, x, y, w, d, h) + topper(b, x, y, w, d, h, c, col);
    const hull = [P(x, y + d), P(x + w, y + d), P(x + w, y), P(x + w, y, h + 12), P(x, y, h + 12), P(x, y + d, h + 12)];
    bl += `<g class="bld" data-id="${b.id}" tabindex="0" role="button" aria-label="${esc(b.name)}. ${esc(b.tagline || '')}"><g class="rise" style="--d:${(i % 9 * .05).toFixed(2)}s">${inner}</g><polygon class="hit" points="${pts(hull)}"/></g>`;
  });
  const m = byId.muse;
  if (m) {
    const c = P(m.at[0], m.at[1], 210);
    let cl = `<g id="cloud" filter="url(#soft)">`;
    [[-34, 6, 22], [-12, -6, 28], [16, -2, 26], [38, 8, 20], [2, 12, 24]].forEach(([dx, dy, r]) => { cl += `<circle cx="${f1(c[0] + dx)}" cy="${f1(c[1] + dy)}" r="${r}" fill="${T.cloud[0]}"/>`; });
    [[-34, 12, 14], [-12, 2, 19], [16, 6, 17], [38, 14, 13], [2, 18, 16]].forEach(([dx, dy, r]) => { cl += `<circle cx="${f1(c[0] + dx)}" cy="${f1(c[1] + dy)}" r="${r}" fill="${T.cloud[1]}" opacity=".6"/>`; });
    bl += `<g class="bld" data-id="muse" tabindex="0" role="button" aria-label="Muse. ${esc(m.tagline)}">${cl}</g><ellipse class="hit" cx="${f1(c[0])}" cy="${f1(c[1])}" rx="76" ry="42"/></g>`;

  B.forEach((b) => {

    const p = b.kind === 'cloud' ? P(b.at[0], b.at[1], 262) : roof(b);
    lb += `<g class="lbl b p${b.prio}" data-id="${b.id}" data-d="${b.d}" data-x="${f1(p[0])}" data-y="${f1(p[1] - 14)}"><rect rx="11" ry="11" height="24" y="-16"/><circle r="4.5" cy="-4" fill="${areaColor(b.d)}"/><text y="0">${esc(b.label)}${WS && state.seen[b.id] ? ' ✓' : ''}</text></g>`;

    lb += `<g class="lbl station" data-x="${f1(p[0])}" data-y="${f1(p[1] - 6)}"><rect rx="10" ry="10" height="21" y="-15"/><text y="0">${esc(s.name)}</text></g>`;
  });

    if (k === 'start') return;
    const r = d.rect, c = P((r[0] + r[2]) / 2, (r[1] + r[3]) / 2, 0), n = inArea(k).length;

  });
  const startSign = (() => { const c = P(start.at[0] + .6, start.at[1] + .6, 110); return `<g class="lbl sign" data-start="1" data-x="${f1(c[0])}" data-y="${f1(c[1])}"><rect rx="14" ry="14" height="40" y="-27" style="fill:${state.world === 'gold' ? '#e6b450' : '#16203a'};stroke:none"/><text y="-2" font-size="17">${esc(WS ? 'Your path' : 'Start here')}</text></g>`; })();

  world.innerHTML = `<g id="ground">${g}</g><g id="areas">${areas}</g><g>${trees}${ringSvg}</g><g id="halos"></g><g id="blds">${bl}</g><g id="walkers"></g><g id="links">${lk}</g><g id="couriers"></g><g id="token"></g><g id="labels">${lb}${signs}${startSign}</g>`;
  sizeLabels(); setupLife(); applyFocus(); apply();
}
function sizeLabels() {
  world.querySelectorAll('.lbl').forEach((g) => {
    const texts = g.querySelectorAll('text'); let w = 0;
    texts.forEach((t) => { let tw = 0; try { tw = t.getComputedTextLength(); } catch { tw = t.textContent.length * 7.5; } w = Math.max(w, tw); });
    const sign = g.classList.contains('sign'), station = g.classList.contains('station');
    const width = w + (sign ? 36 : station ? 20 : 32), r = g.querySelector('rect');
    r.setAttribute('width', width.toFixed(0)); r.setAttribute('x', (-width / 2).toFixed(0));
    const c = g.querySelector('circle'); if (c) c.setAttribute('cx', (-width / 2 + 12).toFixed(0));
    texts.forEach((t) => t.setAttribute('x', (-width / 2 + (sign ? 18 : station ? 10 : 22)).toFixed(0)));
  });
}

/* ---------------------------------------------------------------- life */
let walkers = [], couriers = [], token = null, raf = 0, lastT = 0;

function renderMenu() {
  const opt = (id, label) => `<button type="button" data-world="${id}" aria-pressed="${state.world === id}">${label}</button>`;
  $('menu').innerHTML = `<div><h4>Colours</h4><div class="seg">${opt('day', 'Day')}${opt('night', 'Night')}${opt('gold', 'Gold')}</div></div>
    ${W.filters && W.filters.length > 1 ? `<div><h4>Show only</h4><select id="filter" aria-label="Show only">${W.filters.map(([id, l]) => `<option value="${id}"${state.filter === id ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>` : ''}
    <label class="sw" for="allLinks">Show every link<input type="checkbox" id="allLinks"${state.allLinks ? ' checked' : ''}></label>
    <label class="sw" for="motion">People walking<input type="checkbox" id="motion"${state.motion ? ' checked' : ''}></label>
    <div class="key"><span><i></i>Connected now</span><span><i class="should"></i>${WS ? 'Should connect next' : 'Planned'}</span><span>Scaffolding means coming next. Bright windows mean in use.</span></div>`;
}
function toggleMenu(open) { const m = $('menu'); m.hidden = open === undefined ? !m.hidden : !open; $('b-view').setAttribute('aria-expanded', String(!m.hidden)); if (!m.hidden) renderMenu(); }

/* ---------------------------------------------------------------- input */
const pointers = new Map(); let gesture = null;
svg.addEventListener('pointerdown', (e) => {
  $('hint').hidden = true; store.set('hint', 1); $('tip').hidden = true; toggleMenu(false);
  try { svg.setPointerCapture(e.pointerId); } catch { /* not capturable: dragging still works */ }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); const r = rect();
  if (pointers.size === 1) gesture = { type: 'pan', sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false, target: e.target };
  else if (pointers.size === 2) { const [a, b] = [...pointers.values()], cx = (a.x + b.x) / 2 - r.left, cy = (a.y + b.y) / 2 - r.top; gesture = { type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: view.s, wx: (cx - view.x) / view.s, wy: (cy - view.y) / view.s, moved: true }; }
});
svg.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) { if (e.pointerType === 'mouse') hover(e); return; }
  if (!gesture) return; pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (gesture.type === 'pan' && pointers.size === 1) { const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy; if (!gesture.moved && Math.hypot(dx, dy) > 6) { gesture.moved = true; svg.classList.add('dragging'); } if (gesture.moved) { view.x = gesture.vx + dx; view.y = gesture.vy + dy; apply(); } }
  else if (gesture.type === 'pinch' && pointers.size === 2) { const [a, b] = [...pointers.values()], r = rect(), s = clamp(gesture.s0 * Math.hypot(a.x - b.x, a.y - b.y) / gesture.d0, .15, 2.6); view.s = s; view.x = (a.x + b.x) / 2 - r.left - gesture.wx * s; view.y = (a.y + b.y) / 2 - r.top - gesture.wy * s; apply(); }
});
function activate(target) {
  const b = target?.closest?.('.bld'); if (b) { openCard(b.dataset.id, false); return true; }
  const s = target?.closest?.('.sign'); if (s) { openCard(s.dataset.start ? 'start' : `area:${s.dataset.district}`, true); return true; }
  const a = target?.closest?.('.area'); if (a) { openCard(`area:${a.dataset.district}`, true); return true; }
  return false;
}
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return; pointers.delete(e.pointerId);
  if (gesture && gesture.type === 'pan' && !gesture.moved && e.type === 'pointerup') activate(gesture.target);
  if (!pointers.size) { gesture = null; svg.classList.remove('dragging'); }
  else if (pointers.size === 1) { const [p] = [...pointers.values()]; gesture = { type: 'pan', sx: p.x, sy: p.y, vx: view.x, vy: view.y, moved: true }; }
}
svg.addEventListener('pointerup', endPointer); svg.addEventListener('pointercancel', endPointer);
svg.addEventListener('pointerleave', () => { $('tip').hidden = true; });
svg.addEventListener('wheel', (e) => { e.preventDefault(); $('hint').hidden = true; const r = rect(); zoomAt(view.s * Math.exp(-e.deltaY * .0016), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
function hover(e) {
  const tip = $('tip'), g = e.target.closest?.('.bld,.area');
  if (!g) { tip.hidden = true; return; }
  let name, text;
  if (g.classList.contains('area')) { const d = D[g.dataset.district]; name = d.name; text = d.blurb; }
  else if (g.dataset.id === '__loop') { name = 'The Content Loop'; text = 'Trends, brief, make, package, post, results. Then again.'; }
  else { const b = byId[g.dataset.id]; if (!b) { tip.hidden = true; return; } name = b.name; text = WS && b.ws ? b.ws.verdict[0] : b.tagline; }
  tip.innerHTML = `<b>${esc(name)}</b>${esc(text || '')}`; tip.hidden = false;
  const r = $('stage').getBoundingClientRect(); let x = e.clientX - r.left + 14; if (x + 270 > r.width) x = e.clientX - r.left - 280;
  tip.style.left = `${x}px`; tip.style.top = `${e.clientY - r.top + 14}px`;
}
svg.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && activate(e.target)) e.preventDefault(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (!$('menu').hidden) { toggleMenu(false); return; } if (!$('over').hidden) { $('over').hidden = true; return; } if ($('panel').classList.contains('open')) { closeCard(); return; } wholeTown(); }
  if (e.target.matches && e.target.matches('input,select,textarea')) return;
  const r = rect(); if (e.key === '+' || e.key === '=') zoomAt(view.s * 1.25, r.width / 2, r.height / 2); if (e.key === '-') zoomAt(view.s / 1.25, r.width / 2, r.height / 2);
});
document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) { if (!e.target.closest('#menu,#b-view')) toggleMenu(false); return; }
  if (t.dataset.go) { $('over').hidden = true; state.combo = null; openCard(t.dataset.go, true); return; }
  if (t.dataset.combo) { $('over').hidden = true; openCard(`combo:${t.dataset.combo}`, false); return; }
  if (t.dataset.closeOver) { $('over').hidden = true; return; }
  if (t.dataset.tour) { openCard(W.tour[1], true); return; }
  if (t.dataset.openCombos) { showCombos(); return; }
  if (t.dataset.world) { state.world = t.dataset.world; store.set('world', state.world); T = THEMES[state.world]; render(); renderMenu(); }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'filter') { state.filter = e.target.value; applyFocus(); }
  if (e.target.id === 'allLinks') { state.allLinks = e.target.checked; store.set('allLinks', state.allLinks); applyFocus(); }
  if (e.target.id === 'motion') { state.motion = e.target.checked; store.set('motion', state.motion); setMotion(); }
});
$('close').addEventListener('click', closeCard);
$('b-back').addEventListener('click', wholeTown);
$('b-start').addEventListener('click', () => openCard('start', true));
$('b-combos').addEventListener('click', showCombos);
$('b-all').addEventListener('click', showAll);
$('b-view').addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
$('zin').addEventListener('click', () => { const r = rect(); zoomAt(view.s * 1.3, r.width / 2, r.height / 2); });
$('zout').addEventListener('click', () => { const r = rect(); zoomAt(view.s / 1.3, r.width / 2, r.height / 2); });
$('zfit').addEventListener('click', () => fit(true));
function setMotion() { document.documentElement.classList.toggle('motion', state.motion); cancelAnimationFrame(raf); lastT = 0; if (state.motion) raf = requestAnimationFrame(tick); }

/* ---------------------------------------------------------------- start */
$('title').textContent = W.title; $('subtitle').textContent = W.subtitle; $('b-start').textContent = WS ? 'Your path' : 'Start here';
document.documentElement.dataset.world = state.world;
setMotion(); if (state.motion) document.documentElement.classList.add('intro');
render(); fit(false);
if (store.get('hint', 0)) $('hint').hidden = true; else setTimeout(() => { $('hint').hidden = true; }, 10000);
setTimeout(() => document.documentElement.classList.remove('intro'), 1900);
const h = location.hash.slice(1); if (byId[h]) openCard(h, true); else if (h === 'loop') openCard('__loop', true);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { sizeLabels(); if (!$('panel').classList.contains('open') && !gesture) fit(false); else apply(); });
setTimeout(() => { if (!$('panel').classList.contains('open') && !gesture) fit(false); }, 400);
let rt = 0; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => fit(false), 150); });
})();
</script>
